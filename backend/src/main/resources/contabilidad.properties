# ============================================================================================
# Parametros contables del sistema.
#
# ATENCION: TODOS los codigos de cuenta y TODAS las tasas de este archivo son VALORES DE
# REFERENCIA (placeholders). Deben verificarse contra el catalogo de cuentas real cargado en la BD
# y contra la normativa vigente (IVA, ISSS, AFP, renta, recargos de horas extra) antes de usarse.
#
# Cualquier clave se puede sobreescribir sin recompilar:
#   1. Propiedad de sistema Java:   -Dcuenta.inventario=1104
#   2. Variable de entorno:         CUENTA_INVENTARIO=1104   (mayusculas, puntos -> guion bajo)
#   3. Este archivo (menor precedencia).
# ============================================================================================

# ---- Codigos de cuenta (cuentas.codigo, enteros). Deben existir, estar activos y ser imputables. ----
cuenta.caja=1101
cuenta.bancos=1102
cuenta.clientes=1103
cuenta.inventario=1104
cuenta.iva.credito=1105
cuenta.proveedores=2101
cuenta.iva.debito=2102
cuenta.retenciones.isss=2103
cuenta.retenciones.afp=2104
cuenta.retenciones.renta=2105
cuenta.ventas=4101
cuenta.costo.ventas=5101
cuenta.sueldos=5201
cuenta.ajuste.inventario=5301

# ---- Ventas ----
# true  = la venta se cobra al contado (debito a Caja); false = a credito (debito a Clientes).
venta.contado=true

# ---- Ajustes de inventario ----
# true = un ajuste de inventario genera ademas una partida tipo Ajuste contra cuenta.ajuste.inventario.
ajuste.genera.partida=false

# ---- Impuestos ----
iva.tasa=0.13

# ---- Planilla: ISSS / AFP (porcion del empleado) ----
isss.tasa.empleado=0.03
# Techo mensual de salario sobre el que se calcula el ISSS.
isss.techo=1000.00
afp.tasa.empleado=0.0725

# ---- Planilla: horas extra ----
# Recargo sobre el valor de la hora ordinaria (1.00 = 100 %, 1.25 = 125 %).
hora.extra.diurna.recargo=1.00
hora.extra.nocturna.recargo=1.25
# Horas ordinarias de un mes, para obtener el valor de la hora a partir del sueldo mensual.
horas.mes=240
# Dias del mes comercial usados para prorratear el sueldo por dias trabajados.
dias.mes=30

# ---- Planilla: retencion de renta mensual (tabla progresiva, valores de referencia) ----
# Formula por tramo: retencion = cuota.fija + (base - sobre) * tasa
# La base es el sueldo gravado menos ISSS y AFP del empleado. Un tramo aplica desde su "desde".
renta.tramo.1.desde=0.00
renta.tramo.1.sobre=0.00
renta.tramo.1.tasa=0.00
renta.tramo.1.cuota.fija=0.00
renta.tramo.2.desde=472.01
renta.tramo.2.sobre=472.00
renta.tramo.2.tasa=0.10
renta.tramo.2.cuota.fija=17.67
